<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>{% block title %}Lobotomy{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%235856d6'/%3E%3Cg fill='none' stroke='%23fff' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M16 8c-2 0-3.5 1-4 2.5A3.5 3.5 0 0 0 9 14c0 .6.1 1.2.4 1.7A3 3 0 0 0 8 18a3 3 0 0 0 2.5 3c.2 1.7 1.5 3 3.5 3V14'/%3E%3Cpath d='M16 8c2 0 3.5 1 4 2.5A3.5 3.5 0 0 1 23 14c0 .6-.1 1.2-.4 1.7A3 3 0 0 1 24 18a3 3 0 0 1-2.5 3c-.2 1.7-1.5 3-3.5 3V14'/%3E%3Cline x1='16' y1='14' x2='16' y2='24'/%3E%3Cline x1='13' y1='17' x2='16' y2='17'/%3E%3Cline x1='16' y1='20' x2='19' y2='20'/%3E%3C/g%3E%3C/svg%3E">
  <style>
    :root {
      --bg:          #ffffff;
      --bg2:         #f5f5f7;
      --bg3:         #ebebed;
      --text:        #1c1c1e;
      --text2:       #6c6c70;
      --accent:      #007aff;
      --accent-dark: #0051a8;
      --border:      #d1d1d6;
      --danger:      #ff3b30;
      --success:     #34c759;
      --warn-bg:     #fff3cd;
      --user-bg:     #007aff;
      --user-fg:     #ffffff;
      --ai-bg:       #f0f0f5;
      --ai-fg:       #1c1c1e;
      --tool-bg:     #f8f8fa;
      --nav-h:       56px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-top:    env(safe-area-inset-top, 0px);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg:        #000000;
        --bg2:       #1c1c1e;
        --bg3:       #2c2c2e;
        --text:      #f2f2f7;
        --text2:     #8e8e93;
        --accent:    #0a84ff;
        --border:    #38383a;
        --warn-bg:   #3a3000;
        --user-bg:   #0a84ff;
        --ai-bg:     #2c2c2e;
        --ai-fg:     #f2f2f7;
        --tool-bg:   #1c1c1e;
      }
    }
    :root[data-theme="dark"] {
      --bg:        #000000;
      --bg2:       #1c1c1e;
      --bg3:       #2c2c2e;
      --text:      #f2f2f7;
      --text2:     #8e8e93;
      --accent:    #0a84ff;
      --border:    #38383a;
      --warn-bg:   #3a3000;
      --user-bg:   #0a84ff;
      --ai-bg:     #2c2c2e;
      --ai-fg:     #f2f2f7;
      --tool-bg:   #1c1c1e;
    }
    /* Font size scaling */
    :root[data-fontsize="small"]  { font-size: 13px; }
    :root[data-fontsize="medium"] { font-size: 15px; }
    :root[data-fontsize="large"]  { font-size: 18px; }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 16px;
      line-height: 1.5;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding-top: var(--safe-top);
    }
    /* ── Main content ────────────────────────────────────────── */
    .page {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding-bottom: calc(var(--nav-h) + var(--safe-bottom) + 8px);
    }
    /* ── Bottom nav ──────────────────────────────────────────── */
    .nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: calc(var(--nav-h) + var(--safe-bottom));
      background: var(--bg);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: stretch;
      z-index: 200;
    }
    .nav a {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      padding-bottom: var(--safe-bottom);
      text-decoration: none;
      color: var(--text2);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.02em;
      -webkit-tap-highlight-color: transparent;
    }
    .nav a.active { color: var(--accent); }
    .nav a svg { width: 24px; height: 24px; }
    @keyframes chat-thinking {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    .nav a.ai-busy {
      color: var(--accent);
    }
    .nav a.ai-busy svg {
      animation: chat-thinking 1s ease-in-out infinite;
    }
    /* ── Buttons ─────────────────────────────────────────────── */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 9px 18px;
      border-radius: 10px;
      border: none;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-primary  { background: var(--accent); color: #fff; }
    .btn-ghost    { background: var(--bg3); color: var(--text); }
    .btn-danger   { background: var(--danger); color: #fff; }
    .btn-sm       { padding: 6px 12px; font-size: 13px; border-radius: 8px; }
    /* ── Form controls ───────────────────────────────────────── */
    input[type="text"], textarea, select {
      width: 100%;
      background: var(--bg2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 16px;
      font-family: inherit;
      line-height: 1.4;
      outline: none;
      -webkit-appearance: none;
    }
    input[type="text"]:focus,
    textarea:focus { border-color: var(--accent); }
    /* ── Cards / list items ──────────────────────────────────── */
    .card {
      background: var(--bg2);
      border-radius: 12px;
      padding: 14px 16px;
      margin: 0 16px 10px;
    }
    .section-header {
      font-size: 13px;
      font-weight: 600;
      color: var(--text2);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 18px 16px 6px;
    }
    /* ── Priority badges ─────────────────────────────────────── */
    .badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 20px;
      text-transform: uppercase;
    }
    .badge-top    { background: #ff3b3022; color: #ff3b30; }
    .badge-high   { background: #ff950022; color: #ff9500; }
    .badge-medium { background: #007aff22; color: var(--accent); }
    .badge-low    { background: var(--bg3); color: var(--text2); }
    /* ── Utility ─────────────────────────────────────────────── */
    .text2    { color: var(--text2); }
    .text-sm  { font-size: 13px; }
    .mt-1     { margin-top: 4px; }
    .mt-2     { margin-top: 10px; }
    .flex     { display: flex; }
    .flex-1   { flex: 1; }
    .gap-2    { gap: 8px; }
    .items-center { align-items: center; }
    /* ── Wiki content styles ─────────────────────────────────── */
    .wiki-content { padding: 16px; max-width: 700px; }
    .wiki-content h1 { font-size: 24px; font-weight: 700; margin-bottom: 12px; }
    .wiki-content h2 { font-size: 20px; font-weight: 600; margin: 20px 0 8px; }
    .wiki-content h3 { font-size: 17px; font-weight: 600; margin: 16px 0 6px; }
    .wiki-content p  { margin-bottom: 12px; }
    .wiki-content ul, .wiki-content ol { padding-left: 22px; margin-bottom: 12px; }
    .wiki-content li { margin-bottom: 4px; }
    .wiki-content a         { color: var(--accent); text-decoration: none; }
    .wiki-content a:visited { color: var(--text2); }
    .wiki-content a:hover   { text-decoration: underline; }
    .wiki-content code {
      background: var(--bg3);
      border-radius: 5px;
      padding: 2px 6px;
      font-size: 14px;
      font-family: "SF Mono", "Fira Code", monospace;
    }
    .wiki-content pre {
      background: var(--bg3);
      border-radius: 10px;
      padding: 14px;
      overflow-x: auto;
      margin-bottom: 12px;
      font-size: 13px;
    }
    .wiki-content pre code { background: none; padding: 0; }
    .wiki-content table { border-collapse: collapse; width: 100%; margin-bottom: 12px; font-size: 14px; }
    .wiki-content th, .wiki-content td { border: 1px solid var(--border); padding: 7px 10px; text-align: left; }
    .wiki-content th { background: var(--bg2); font-weight: 600; }
    .wiki-content blockquote {
      border-left: 3px solid var(--accent);
      padding-left: 12px;
      color: var(--text2);
      margin-bottom: 12px;
    }
    .wiki-content hr { border: none; border-top: 1px solid var(--border); margin: 20px 0; }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  {% block body %}{% endblock %}

  <nav class="nav">
    {% if current_user %}
    <form method="post" action="/auth/logout" style="display:none" id="logout-form"></form>
    {% endif %}
    <a href="/chat" id="nav-chat" {% if active == 'chat' %}class="active"{% endif %}>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
      Chat
    </a>
    <a href="/wiki/" {% if active == 'wiki' %}class="active"{% endif %}>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
      </svg>
      Wiki
    </a>
    <a href="/reading-list" {% if active == 'inbox' %}class="active"{% endif %}>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>
      </svg>
      Reading List
    </a>
    <a href="/settings" {% if active == 'settings' %}class="active"{% endif %}>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
      Settings
    </a>
  </nav>
  <script>
  (function() {
    // One place that turns an HTTP response into either JSON or a readable error.
    //
    // Every fetch in these templates used to do `await resp.json()` with no status check,
    // so ANY non-JSON reply surfaced as "JSON.parse: unexpected character at line 1
    // column 1" — a message that names neither what went wrong nor what to do. Observed
    // while saving a pasted article: the session had expired, require_login answered 302,
    // fetch followed it transparently, and resp.json() met the login page's `<!DOCTYPE`.
    // The server now answers 401 JSON to a fetch; this is the half that reads it, and it
    // also covers the cases the server cannot make JSON — a proxy's 502 page, a dropped
    // connection, a timeout.
    //
    // The X-Requested-With header is what lets the server tell this apart from a browser
    // navigation, which must still redirect or the login flow breaks.
    window.apiFetch = async function(url, opts) {
      opts = Object.assign({}, opts);
      opts.headers = Object.assign({'X-Requested-With': 'fetch'}, opts.headers || {});
      let resp;
      try {
        resp = await fetch(url, opts);
      } catch (e) {
        if (e.name === 'AbortError') throw new Error('The server did not answer in time. It may still be working — reload to check before trying again.');
        throw new Error('Could not reach the server. Check your connection and try again.');
      }
      const body = await resp.text();
      let data = null;
      try { data = JSON.parse(body); } catch (e) { /* not JSON — handled below */ }
      if (data && data.login_required) {
        const err = new Error(data.error || 'Your session has expired — sign in again.');
        err.loginRequired = true;
        err.loginUrl = data.login_url || '/auth/login';
        throw err;
      }
      if (data) {
        if (!resp.ok) {
          // `detail` is the server's own exception text (see _unhandled in serve.py). It was
          // sent and then dropped here, so a crash said "check the log" and nothing else —
          // and the log is exactly where someone is not looking when a save has just failed.
          throw new Error((data.error || ('The server returned ' + resp.status + '.')) +
                          (data.detail ? ' [' + data.detail + ']' : ''));
        }
        return data;
      }
      // Not JSON. Say which page we got rather than quoting its first character — and let
      // the STATUS pick the explanation. The first version guessed "you may have been
      // signed out" for any HTML page, and then said exactly that about an HTTP 500: a
      // message naming a move that cannot fix the problem, which is the same failure the
      // write-path refusals are judged on (principle 4). A 5xx is the server breaking, and
      // reloading and signing in will produce it again.
      // An HTML body means this did NOT come from the application: every route here
      // answers JSON, and _unhandled turns even a crash into JSON. So something in front
      // of the application answered — nginx, a load balancer, a tunnel — and the
      // application never saw the request.
      //
      // Getting this wrong cost a user a real debugging session. The 5xx branch used to
      // say "the server log has the traceback" for ANY status >= 500, including this case;
      // they went and looked, and the log was silent, because the request had never
      // arrived. A message must not assert something it cannot know. What it CAN know is
      // whether the body was our JSON, and that is exactly the thing that distinguishes
      // "the app failed" from "the app was never reached".
      if (/^\s*<(!doctype|html)/i.test(body)) {
        const who = (body.match(/<title[^>]*>([^<]{0,80})/i) || [])[1]
                 || (body.match(/\b(nginx|apache|cloudflare|gunicorn|varnish)\b/i) || [])[1]
                 || '';
        const named = who ? ' It identifies itself as: ' + who.trim() + '.' : '';
        if (resp.status >= 500) {
          throw new Error('HTTP ' + resp.status + ' from something in front of the '
            + 'application — it answered with a web page, and every route here answers '
            + 'JSON, so your request never reached Lobotomy.' + named
            + ' Nothing will be in the Lobotomy log; look in the proxy\'s log instead. '
            + 'A 504 is its read timeout, a 502 an upstream that closed, a 413 a body it '
            + 'judged too large.');
        }
        throw new Error('The server sent a web page instead of an answer (HTTP ' + resp.status +
                        '). You may have been signed out — reload the page and sign in.');
      }
      if (resp.status >= 500) {
        throw new Error('The server hit an error and could not complete this (HTTP ' +
                        resp.status + '). This is a fault on the server, not your session '
                        + '— signing in again will not help, and the reply was not JSON, '
                        + 'so it may not have come from the application.');
      }
      throw new Error('The server returned ' + resp.status + ' ' + (resp.statusText || '') +
                      (body ? ': ' + body.slice(0, 200) : '.'));
    };

    // Theme
    function applyTheme(t) {
      if (t === 'dark')       document.documentElement.setAttribute('data-theme', 'dark');
      else if (t === 'light') document.documentElement.setAttribute('data-theme', 'light');
      else                    document.documentElement.removeAttribute('data-theme');
    }
    applyTheme(localStorage.getItem('theme') || 'system');
    window.setTheme = function(t) {
      localStorage.setItem('theme', t);
      applyTheme(t);
    };

    // Font size
    function applyFontSize(s) {
      document.documentElement.setAttribute('data-fontsize', s || 'medium');
    }
    applyFontSize(localStorage.getItem('fontSize') || 'medium');
    window.setFontSize = function(s) {
      localStorage.setItem('fontSize', s);
      applyFontSize(s);
    };
  })();
  </script>
  <script>
  (function() {
    var navChat = document.getElementById('nav-chat');
    if (!navChat) return;

    // Queue bar. Shown only while jobs are waiting, on every page, because the moment
    // you want it is mid-workflow: a batch of wikifies queued, a bug spotted, and a
    // deploy that should not abandon the article currently being written.
    var bar = document.createElement('div');
    bar.id = 'queue-bar';
    bar.hidden = true;
    Object.assign(bar.style, {
      position: 'fixed', bottom: '68px', left: '50%', transform: 'translateX(-50%)',
      zIndex: 900, display: 'flex', alignItems: 'center', gap: '10px',
      padding: '7px 12px', borderRadius: '20px', fontSize: '13px',
      background: 'var(--bg2)', color: 'var(--text)',
      border: '1px solid var(--border)', boxShadow: '0 2px 10px rgba(0,0,0,.25)'
    });
    var label = document.createElement('span');
    var btn = document.createElement('button');
    btn.textContent = 'Clear queue';
    Object.assign(btn.style, {
      font: 'inherit', cursor: 'pointer', padding: '3px 10px', borderRadius: '12px',
      border: '1px solid var(--border)', background: 'var(--bg)', color: 'var(--text)'
    });
    btn.onclick = async function () {
      if (!confirm('Drop the queued articles?\n\nThe one being written now will finish — '
                 + 'the rest stay in the reading list and can be run again later.')) return;
      btn.disabled = true;
      try {
        var d = await apiFetch('/chat/queue/drain', {method: 'POST'});
        label.textContent = d.dropped + ' dropped — finishing the current one';
      } catch (e) {
        label.textContent = 'Could not clear the queue';
      }
      setTimeout(function () { btn.disabled = false; syncBusy(); }, 2500);
    };
    bar.appendChild(label); bar.appendChild(btn);
    document.body.appendChild(bar);

    function syncBusy() {
      apiFetch('/chat/status').then(function(s) {
        if (s.running) navChat.classList.add('ai-busy');
        else navChat.classList.remove('ai-busy');
        var n = s.pending || 0;
        if (n > 0 && !btn.disabled) {
          label.textContent = n + (n === 1 ? ' article queued' : ' articles queued');
          bar.hidden = false;
        } else if (!btn.disabled) {
          bar.hidden = true;
        }
      }).catch(function(){});
    }
    syncBusy();
    setInterval(syncBusy, 2000);
  })();
  </script>
</body>
</html>
