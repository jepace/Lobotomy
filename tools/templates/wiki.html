{% extends "base.html" %}
{% block title %}{{ title }} — Wiki{% endblock %}

{% block head %}
<style>
  .wiki-topbar {
    position: sticky;
    top: 0;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    z-index: 100;
  }
  .wiki-topbar h1 {
    font-size: 17px;
    font-weight: 600;
    flex: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .wiki-sections {
    display: flex;
    gap: 6px;
    padding: 8px 16px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    border-bottom: 1px solid var(--border);
  }
  .wiki-sections::-webkit-scrollbar { display: none; }
  .wiki-pill {
    flex-shrink: 0;
    padding: 5px 12px;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 16px;
    font-size: 13px;
    color: var(--text);
    text-decoration: none;
    white-space: nowrap;
    -webkit-tap-highlight-color: transparent;
  }
  .wiki-pill.current { background: var(--accent); color: #fff; border-color: var(--accent); }

  /* wiki search */
  .wiki-search-wrap { padding: 8px 16px; border-bottom: 1px solid var(--border); position: relative; }
  .wiki-search-input {
    width: 100%; padding: 7px 12px; font-size: 13px;
    border: 1px solid var(--border); border-radius: 20px;
    background: var(--bg2); color: var(--text); outline: none; box-sizing: border-box;
  }
  .wiki-search-input:focus { border-color: var(--accent); }
  .wiki-search-results {
    display: none; position: absolute; left: 16px; right: 16px; top: 100%;
    background: var(--bg2); border: 1px solid var(--border); border-radius: 10px;
    box-shadow: 0 4px 20px rgba(0,0,0,.2); z-index: 200; overflow: hidden;
    max-height: 60vh; overflow-y: auto;
  }
  .wiki-search-results.open { display: block; }
  .search-result {
    display: block; padding: 9px 14px; text-decoration: none; color: var(--text);
    border-bottom: 1px solid var(--border);
  }
  .search-result:last-child { border-bottom: none; }
  .search-result:hover,
  .search-result.sel { background: var(--bg3); }
  /* The keyboard selection needs to be visible against hover, which fires under the
     pointer wherever it happens to rest while you are using the arrow keys. */
  .search-result.sel { box-shadow: inset 3px 0 0 var(--accent); }
  .search-more {
    padding: 8px 14px; font-size: 12px; color: var(--text2);
    border-top: 1px solid var(--border); background: var(--bg3);
  }
  .search-result-title { font-size: 14px; font-weight: 600; }
  .search-result-excerpt { font-size: 12px; color: var(--text2); margin-top: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .search-no-results { padding: 12px 14px; font-size: 13px; color: var(--text2); }

  /* chat-about button */
  .chat-about {
    flex-shrink: 0;
    padding: 6px 12px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 16px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    text-decoration: none;
    -webkit-tap-highlight-color: transparent;
  }
</style>
{% endblock %}

{% block body %}
<div class="page">
  <div class="wiki-topbar">
    <a href="/wiki/" style="color:var(--accent); text-decoration:none; font-size:22px; line-height:1;">‹</a>
    <h1>{{ title }}</h1>
    <a class="chat-about" style="background:var(--bg2);color:var(--text);border:1px solid var(--border);margin-right:4px;" href="/wiki/{{ current_path }}/edit">Edit</a>
    {% if current_path %}
    <a class="chat-about" style="background:var(--bg2);color:var(--text);border:1px solid var(--border);margin-right:4px;"
       href="/wiki/{{ current_path }}/history">History</a>
    <button class="chat-about" type="button"
            style="background:var(--bg2);color:var(--text);border:1px solid var(--border);margin-right:4px;cursor:pointer;"
            onclick="copyPlainText(this)">Copy Text</button>
    <button id="share-btn" class="chat-about" type="button"
            style="background:var(--bg2);color:var(--text);border:1px solid var(--border);margin-right:4px;cursor:pointer;"
            data-shared="{{ 'true' if share_url else 'false' }}"
            onclick="toggleShare(this)">{{ 'Unshare' if share_url else 'Share' }}</button>
    {% endif %}
    <a class="chat-about" href="/chat" onclick="setChatPrompt('Tell me about {{ title }}')">Ask AI</a>
  </div>

  <div class="wiki-sections">
    {% for s in sections %}
    <a class="wiki-pill {% if current_path == s.path or current_path.startswith(s.path) %}current{% endif %}"
       href="/wiki/{{ s.path }}">{{ s.label }}</a>
    {% endfor %}
    <a class="wiki-pill" href="/raw/" style="margin-left:auto">Raw</a>
  </div>

  <div class="wiki-search-wrap">
    <input id="wiki-search" class="wiki-search-input" type="search" placeholder="Search wiki… (in:sources  tag:energy)" autocomplete="off" spellcheck="false">
    <div id="wiki-search-results" class="wiki-search-results" role="listbox"></div>
  </div>

  <div class="wiki-content">
    {{ content | safe }}
  </div>
</div>

<script>
function setChatPrompt(text) {
  sessionStorage.setItem('chatPrompt', text);
}

function toast(text) {
  const e = document.createElement('div');
  e.textContent = text;
  Object.assign(e.style, {
    position: 'fixed', top: '12px', right: '12px', zIndex: 2147483647,
    padding: '10px 14px', background: 'var(--accent)', color: '#fff',
    borderRadius: '8px', font: '14px -apple-system,system-ui,sans-serif',
    boxShadow: '0 2px 12px rgba(0,0,0,.3)',
  });
  document.body.appendChild(e);
  setTimeout(() => e.remove(), 2200);
}

async function copyPlainText(btn) {
  const path = {{ current_path | tojson }};
  btn.disabled = true;
  try {
    const r = await fetch(`/api/wiki/${path}/text`);
    const d = await r.json();
    if (!d.ok) { toast(d.error || 'Failed to get text'); return; }
    try {
      await navigator.clipboard.writeText(d.text);
      toast('Copied as plain text');
    } catch (e) {
      window.prompt('Copy this text:', d.text);
    }
  } catch (e) {
    toast('Network error');
  }
  btn.disabled = false;
}

async function toggleShare(btn) {
  const path = {{ current_path | tojson }};
  const shared = btn.dataset.shared === 'true';
  btn.disabled = true;
  try {
    if (shared) {
      const r = await fetch(`/api/wiki/${path}/unshare`, {method: 'POST'});
      const d = await r.json();
      if (d.ok) {
        btn.dataset.shared = 'false';
        btn.textContent = 'Share';
        toast('Link revoked');
      } else {
        toast(d.error || 'Failed to revoke');
      }
    } else {
      const r = await fetch(`/api/wiki/${path}/share`, {method: 'POST'});
      const d = await r.json();
      if (d.ok) {
        btn.dataset.shared = 'true';
        btn.textContent = 'Unshare';
        try {
          await navigator.clipboard.writeText(d.url);
          toast('Link copied — anyone with it can view this page');
        } catch (e) {
          window.prompt('Share link (copy it):', d.url);
        }
      } else {
        toast(d.error || 'Failed to create link');
      }
    }
  } catch (e) {
    toast('Network error');
  }
  btn.disabled = false;
}

// Wiki search
(function() {
  const inp = document.getElementById('wiki-search');
  const box = document.getElementById('wiki-search-results');
  let timer = null;

  function highlight(text, q) {
    if (!q) return text;
    const words = q.trim().split(/\s+/).filter(w => w && !w.toLowerCase().startsWith('in:') && !w.toLowerCase().startsWith('tag:'));
    let out = text;
    words.forEach(w => {
      out = out.replace(new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'gi'),
        m => `<mark style="background:var(--accent);color:#fff;border-radius:2px;padding:0 1px">${m}</mark>`);
    });
    return out;
  }

  // Index of the highlighted row, or -1 when nothing is selected. Re-derived from the
  // DOM on every render rather than kept in sync by hand.
  let sel = -1;
  const rows = () => box.querySelectorAll('.search-result');

  function select(i) {
    const list = rows();
    if (!list.length) { sel = -1; return; }
    if (i < 0) i = list.length - 1;            // wrap, so Up from the top reaches the end
    if (i >= list.length) i = 0;
    list.forEach(el => { el.classList.remove('sel'); el.removeAttribute('aria-selected'); });
    sel = i;
    const el = list[sel];
    el.classList.add('sel');
    el.setAttribute('aria-selected', 'true');
    // 'nearest' scrolls only when the row is actually out of view, so walking down a
    // visible list does not jump the popup around under you.
    el.scrollIntoView({ block: 'nearest' });
  }

  async function doSearch(q) {
    if (q.length < 2) { box.classList.remove('open'); return; }
    const r = await fetch('/wiki/search?q=' + encodeURIComponent(q));
    const data = await r.json();
    if (inp.value.trim() !== q) return; // stale
    sel = -1;
    if (!data.results.length) {
      box.innerHTML = `<div class="search-no-results">No results for "${q}"</div>`;
    } else {
      let html = data.results.map(res => `
        <a class="search-result" href="/wiki/${res.path}" role="option">
          <div class="search-result-title">${highlight(res.title, q)}</div>
          ${res.excerpt ? `<div class="search-result-excerpt">${highlight(res.excerpt, q)}</div>` : ''}
        </a>`).join('');
      const total = data.total || data.results.length;
      if (total > data.results.length) {
        html += `<div class="search-more">Showing ${data.results.length} of ${total} matches — narrow the search to see the rest</div>`;
      }
      box.innerHTML = html;
      select(0);      // Enter always does something predictable
    }
    box.classList.add('open');
    box.scrollTop = 0;
  }

  inp.addEventListener('input', () => {
    clearTimeout(timer);
    const q = inp.value.trim();
    if (!q) { box.classList.remove('open'); return; }
    timer = setTimeout(() => doSearch(q), 200);
  });

  inp.addEventListener('keydown', e => {
    const open = box.classList.contains('open') && rows().length;
    if (e.key === 'Escape') { box.classList.remove('open'); inp.blur(); return; }
    if (!open) return;
    if (e.key === 'ArrowDown') { e.preventDefault(); select(sel + 1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); select(sel - 1); }
    else if (e.key === 'Home') { e.preventDefault(); select(0); }
    else if (e.key === 'End') { e.preventDefault(); select(rows().length - 1); }
    else if (e.key === 'Enter') {
      // preventDefault so the surrounding form (if any) does not also submit.
      e.preventDefault();
      const el = rows()[sel < 0 ? 0 : sel];
      if (el) window.location.href = el.getAttribute('href');
    }
  });

  // Keep the pointer and the keyboard agreeing: if the mouse moves onto a row, that row
  // becomes the selection, so Enter opens what is visibly highlighted either way.
  box.addEventListener('mousemove', e => {
    const el = e.target.closest('.search-result');
    if (!el) return;
    const i = Array.prototype.indexOf.call(rows(), el);
    if (i !== -1 && i !== sel) select(i);
  });

  document.addEventListener('click', e => {
    if (!e.target.closest('.wiki-search-wrap')) box.classList.remove('open');
  });
})();
</script>
{% endblock %}
