<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>{{ title }}</title>
<style>
  :root {
    --bg: #ffffff; --bg2: #f5f5f7; --text: #1c1c1e; --text2: #6e6e73; --border: #e5e5ea; --accent: #007aff;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1c1c1e; --bg2: #2c2c2e; --text: #f2f2f7; --text2: #98989d; --border: #38383a; --accent: #0a84ff; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .page { max-width: 680px; margin: 0 auto; padding: 32px 20px 60px; }
  h1 { font-size: 26px; font-weight: 700; margin: 0 0 6px; }
  .source-link { font-size: 14px; margin-bottom: 24px; }
  .source-link a { color: var(--accent); text-decoration: none; }
  .content h2 { font-size: 19px; font-weight: 700; margin: 28px 0 10px; }
  .content h3 { font-size: 16px; font-weight: 700; margin: 22px 0 8px; }
  .content p { margin: 0 0 14px; }
  .content ul, .content ol { padding-left: 22px; margin: 0 0 14px; }
  .content li { margin-bottom: 4px; }
  .content a { color: var(--accent); }
  .content blockquote {
    margin: 0 0 14px; padding: 2px 16px; border-left: 3px solid var(--border); color: var(--text2);
  }
  .content code { background: var(--bg2); padding: 1px 5px; border-radius: 4px; font-size: 14px; }
  .content pre { background: var(--bg2); padding: 12px; border-radius: 8px; overflow-x: auto; }
  .footer {
    margin-top: 40px; padding-top: 16px; border-top: 1px solid var(--border);
    font-size: 12px; color: var(--text2);
  }
</style>
</head>
<body>
<div class="page">
  <h1>{{ title }}</h1>
  {% if source_url %}
  <div class="source-link"><a href="{{ source_url }}" rel="noopener noreferrer" target="_blank">Original article ↗</a></div>
  {% endif %}
  <div class="content">{{ content | safe }}</div>
  <div class="footer">Shared from a personal Lobotomy wiki.</div>
</div>
</body>
</html>
